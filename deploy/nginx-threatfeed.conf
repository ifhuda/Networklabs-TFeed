# /etc/nginx/sites-available/threatfeed.conf
#
# Terminasi TLS + rate limit di depan uvicorn (127.0.0.1:8080).
# FortiGate memvalidasi sertifikat saat `set server-identity-check full`,
# jadi gunakan sertifikat yang rantainya dipercaya FortiGate — untuk PKI internal
# (Networklabs-Root-CA), impor Root CA ke FortiGate: System > Certificates > Import > CA.

limit_req_zone $binary_remote_addr zone=tf_ingest:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=tf_feed:10m   rate=120r/m;
limit_req_zone $binary_remote_addr zone=tf_login:10m  rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name threatfeed.networklabs.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name threatfeed.networklabs.id;

    ssl_certificate     /etc/ssl/certs/threatfeed-fullchain.pem;
    ssl_certificate_key /etc/ssl/private/threatfeed.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:TF:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/threatfeed.access.log;
    error_log  /var/log/nginx/threatfeed.error.log warn;

    client_max_body_size 32m;   # payload FortiSOAR bisa besar (ribuan entri)

    # ---- push dari FortiSOAR ------------------------------------------------
    location = /api/v1/ingest {
        limit_req zone=tf_ingest burst=10 nodelay;
        # allow 10.10.10.20;   # IP FortiSOAR
        # deny  all;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }

    # ---- tarikan FortiGate --------------------------------------------------
    location = /api/v1/feed/fortigate {
        limit_req zone=tf_feed burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_buffering on;
        proxy_buffers 16 64k;
        proxy_busy_buffers_size 128k;
    }

    # ---- login dashboard ----------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=tf_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # ---- dashboard & sisanya ------------------------------------------------
    location / {
        # allow 10.10.10.0/24;   # batasi ke subnet operator SOC
        # deny  all;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
}

# /etc/nginx/proxy_params harus berisi:
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
