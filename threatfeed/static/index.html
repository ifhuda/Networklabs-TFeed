<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IoC-WATCH · Threat Feed Console</title>
<style>
/* ============================================================ design tokens
   Palet diturunkan dari domainnya sendiri: warna TLP resmi adalah satu-satunya
   warna "keras" di layar. Chrome UI memakai slate-tinta + satu aksen teal
   telemetri, supaya badge TLP tetap menjadi elemen paling nyaring.
   Tanpa CDN sama sekali — aman untuk SOC yang terisolasi dari internet.      */
:root{
  --bg:#0B1017; --surface:#121A24; --surface-2:#182231; --surface-3:#1E2A3A;
  --line:#22303F; --line-soft:#1A2431;
  --text:#DCE5EE; --muted:#7A8CA0; --dim:#4E5F72;
  --accent:#35D0C3; --accent-dim:#1B6F6A;
  --tlp-red:#E5484D; --tlp-amber:#F5A524; --tlp-green:#30A46C; --tlp-white:#E6EAEF;
  --heat-5:#E5484D; --heat-4:#F76808; --heat-3:#F5A524; --heat-2:#5B8DEF; --heat-1:#5E6E80;
  --mono:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-dim);color:#fff}
a{color:var(--accent);text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.eyebrow{
  font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--dim); font-weight:600;
}
.wrap{max-width:1560px;margin:0 auto;padding:0 20px 64px}

/* ==================================================================== header */
header{
  border-bottom:1px solid var(--line); background:linear-gradient(180deg,#0F1620,#0B1017);
  position:sticky; top:0; z-index:30;
}
.hdr{max-width:1560px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.brand b span{color:var(--accent)}
.brand small{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.spacer{flex:1}
.pill{
  display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted);
  font-family:var(--mono);
}
.dot{width:7px;height:7px;border-radius:99px;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2.6s infinite}
.dot.stale{background:var(--tlp-amber);animation:none}
.dot.down{background:var(--tlp-red);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(53,208,195,.45)}70%{box-shadow:0 0 0 7px rgba(53,208,195,0)}100%{box-shadow:0 0 0 0 rgba(53,208,195,0)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}*{transition:none!important}}

.btn{
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);
  padding:7px 13px;font-size:12px;cursor:pointer;transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--surface-3);border-color:var(--dim)}
.btn.primary{background:var(--accent);color:#04201E;border-color:var(--accent);font-weight:700}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}

/* ========================================================= signature: decay */
.decay{
  border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  margin:20px 0 18px;padding:14px 16px 11px;
}
.decay-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:11px}
.decay-head h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.decay-head .note{font-size:11px;color:var(--muted);font-family:var(--mono)}
.track{
  display:flex;align-items:flex-end;gap:1px;height:56px;position:relative;
  border-bottom:1px solid var(--line);
}
.tick{flex:1;min-width:2px;display:flex;flex-direction:column-reverse;border-radius:1px 1px 0 0;opacity:.9}
.tick i{display:block;width:100%}
.tick:hover{outline:1px solid var(--accent);outline-offset:1px}
.cliff{position:absolute;top:-4px;bottom:-1px;width:0;border-left:1px dashed var(--tlp-red)}
.cliff::after{
  content:attr(data-label);position:absolute;top:-6px;left:6px;white-space:nowrap;
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--tlp-red);font-weight:700;
}
.axis{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ===================================================================== stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:18px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px}
.card .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:600}
.card .v{font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.02em;margin:6px 0 2px}
.card .s{font-size:11px;color:var(--muted);font-family:var(--mono)}
.card .v.small{font-size:16px;line-height:1.7}

/* =================================================================== toolbar */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.search{position:relative;flex:1;min-width:250px}
.search input{
  width:100%;padding:9px 12px 9px 32px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);font-family:var(--mono);font-size:13px;
}
.search input::placeholder{color:var(--dim)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.45}
select{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:9px 10px;font-size:12px;min-width:120px;
}

/* ===================================================================== table */
.tablewrap{border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:960px}
thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;padding:9px 14px;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;
}
thead th:hover{color:var(--text)}
thead th.static{cursor:default}
thead th .arrow{color:var(--accent);font-size:9px}
tbody td{padding:10px 14px;border-bottom:1px solid var(--line-soft);vertical-align:top}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
.ip{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.ip.inactive{color:var(--dim);text-decoration:line-through}
.type{font-size:12px;color:var(--text)}
.meta{font-size:11px;color:var(--muted);font-family:var(--mono)}
.comment{font-size:12px;color:var(--muted);max-width:400px}

/* severity = heat bar (lebar = confidence) ; TLP = badge resmi */
.heat{display:flex;align-items:center;gap:8px;min-width:132px}
.heat .bar{flex:1;height:5px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.heat .bar i{display:block;height:100%;border-radius:99px}
.heat .lbl{font-size:11px;font-family:var(--mono);white-space:nowrap;min-width:74px}
.badge{
  display:inline-block;padding:2px 7px;border-radius:2px;font-size:10px;font-weight:700;
  letter-spacing:.08em;font-family:var(--mono);border:1px solid;white-space:nowrap;
}
.tlp-red{color:var(--tlp-red);border-color:var(--tlp-red);background:rgba(229,72,77,.1)}
.tlp-amber{color:var(--tlp-amber);border-color:var(--tlp-amber);background:rgba(245,165,36,.1)}
.tlp-green{color:var(--tlp-green);border-color:var(--tlp-green);background:rgba(48,163,108,.1)}
.tlp-white{color:var(--tlp-white);border-color:#54606D;background:rgba(230,234,239,.07)}
.st{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.st.active{color:var(--tlp-green)} .st.expired{color:var(--tlp-amber)} .st.revoked{color:var(--dim)}
.rowdel{background:none;border:0;color:var(--dim);cursor:pointer;padding:2px 6px;border-radius:3px}
.rowdel:hover{color:var(--tlp-red);background:rgba(229,72,77,.1)}

.foot{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
.foot .meta{flex:1}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text);margin-bottom:6px;font-size:15px}

/* ==================================================================== audit */
.audit{margin-top:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.audit summary{padding:11px 16px;cursor:pointer;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.audit summary:hover{color:var(--text)}
.audit .body{border-top:1px solid var(--line);max-height:340px;overflow:auto}
.audit table{min-width:820px}
.audit td{font-family:var(--mono);font-size:11px;padding:7px 14px}

/* ==================================================================== login */
.gate{position:fixed;inset:0;background:rgba(11,16,23,.94);display:none;place-items:center;z-index:99}
.gate.on{display:grid}
.gate form{
  width:340px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);
  padding:26px;
}
.gate h1{margin:0 0 4px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.gate p{margin:0 0 18px;font-size:12px;color:var(--muted)}
.gate input{
  width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--line);
  border-radius:var(--r);font-family:var(--mono);margin-bottom:11px;
}
.err{color:var(--tlp-red);font-size:12px;min-height:17px;margin-bottom:6px}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:120;
  background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s
}
.toast.on{opacity:1}
@media (max-width:640px){.hdr{flex-wrap:wrap;gap:10px}.wrap{padding:0 12px 40px}}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="brand">
      <b>IoC<span>·</span>WATCH</b>
      <small>Threat Feed Console</small>
    </div>
    <div class="spacer"></div>
    <span class="pill"><span class="dot" id="healthDot"></span><span id="healthTxt">menghubungkan…</span></span>
    <button class="btn ghost" id="btnRefresh">Muat ulang</button>
    <button class="btn ghost" id="btnPrune">Jalankan pruning</button>
    <button class="btn ghost" id="btnLogout">Keluar</button>
  </div>
</header>

<div class="wrap">

  <!-- SIGNATURE: strip peluruhan TTL -->
  <section class="decay">
    <div class="decay-head">
      <h2>Peluruhan TTL</h2>
      <span class="note" id="decayNote">—</span>
      <div class="spacer"></div>
      <span class="eyebrow">Tiap batang = 1 hari sejak pembaruan terakhir · warna = severity</span>
    </div>
    <div class="track" id="track"></div>
    <div class="axis"><span>hari ini</span><span id="axisMid">—</span><span id="axisEnd">—</span></div>
  </section>

  <section class="stats" id="stats"></section>

  <div class="toolbar">
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari IP, tipe, TLP, sumber, atau komentar…" autocomplete="off">
    </div>
    <select id="fSeverity"><option value="">Semua severity</option></select>
    <select id="fTlp"><option value="">Semua TLP</option></select>
    <select id="fType"><option value="">Semua tipe</option></select>
    <select id="fSource"><option value="">Semua sumber</option></select>
    <select id="fStatus">
      <option value="">Semua status</option>
      <option value="active">Aktif</option>
      <option value="expired">Kedaluwarsa</option>
      <option value="revoked">Dicabut</option>
    </select>
    <select id="fSize"><option>50</option><option>100</option><option>250</option><option>500</option></select>
    <button class="btn ghost" id="btnClear">Bersihkan filter</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th data-sort="ip_address">IP Address</th>
        <th data-sort="type">Type</th>
        <th data-sort="severity">Severity / Conf.</th>
        <th data-sort="tlp">TLP</th>
        <th data-sort="updated_at">Last Updated</th>
        <th data-sort="source">Source</th>
        <th class="static">Comment</th>
        <th class="static"></th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden></div>
  </div>

  <div class="foot">
    <span class="meta" id="pageInfo">—</span>
    <button class="btn" id="prev">← Sebelumnya</button>
    <button class="btn" id="next">Berikutnya →</button>
  </div>

  <details class="audit">
    <summary>Jejak audit</summary>
    <div class="body">
      <table><tbody id="auditRows"></tbody></table>
    </div>
  </details>
</div>

<div class="gate" id="gate">
  <form id="loginForm">
    <h1>IoC·WATCH</h1>
    <p>Masuk untuk melihat konsol threat feed.</p>
    <input id="pw" type="password" placeholder="Password dashboard" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button class="btn primary" type="submit" style="width:100%">Masuk</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const state = { page:1, size:50, sort:'updated_at', order:'desc', filtersLoaded:false };

/* ------------------------------------------------------------------ helpers */
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }

function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>(
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function ago(iso){
  if(!iso) return '—';
  const d=(Date.now()-new Date(iso.replace(' ','T')).getTime())/1000;
  if(d<60) return 'baru saja';
  if(d<3600) return Math.floor(d/60)+' mnt lalu';
  if(d<86400) return Math.floor(d/3600)+' jam lalu';
  return Math.floor(d/86400)+' hari lalu';
}
const heatOf = s => ({Malicious:'var(--heat-5)',Critical:'var(--heat-4)',High:'var(--heat-3)',
  Medium:'var(--heat-2)'}[s] || 'var(--heat-1)');
const tlpClass = t => 'tlp-'+((String(t).split(':')[1]||'white').split('+')[0].toLowerCase());

async function api(path, opts={}){
  const r = await fetch(path, {credentials:'same-origin',
    headers:{'Content-Type':'application/json'}, ...opts});
  if(r.status===401){ $('#gate').classList.add('on'); throw new Error('unauth'); }
  if(!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.status===204 ? null : r.json();
}

/* -------------------------------------------------------------------- login */
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('#loginErr').textContent='';
  try{
    await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({password:$('#pw').value})});
    $('#gate').classList.remove('on'); $('#pw').value=''; boot();
  }catch(err){ $('#loginErr').textContent = 'Password salah. Coba lagi.'; }
});
$('#btnLogout').onclick = async () => {
  await fetch('/api/v1/auth/logout',{method:'POST',credentials:'same-origin'});
  $('#gate').classList.add('on');
};

/* -------------------------------------------------------------------- stats */
function renderStats(s){
  const li = s.last_ingest, lp = s.last_pull;
  const staleH = li ? (Date.now()-new Date(li.ts).getTime())/36e5 : 999;
  const dot=$('#healthDot');
  dot.className = 'dot' + (staleH>24 ? ' down' : staleH>6 ? ' stale' : '');
  $('#healthTxt').textContent = li ? `ingest terakhir ${ago(li.ts)}` : 'belum ada ingest';

  $('#stats').innerHTML = [
    ['Total IP terdeteksi', s.total.toLocaleString('id-ID'),
     `${s.active.toLocaleString('id-ID')} aktif · +${s.added_24h} dalam 24 jam`],
    ['Disajikan ke FortiGate', s.in_feed.toLocaleString('id-ID'),
     `TTL ${s.ttl_days} hari · ${s.expired.toLocaleString('id-ID')} kedaluwarsa`],
    ['Sinkronisasi terakhir', li ? ago(li.ts) : '—',
     li ? `${li.entries_ok} entri dari ${esc(li.client_ip)}` : 'menunggu push FortiSOAR', 1],
    ['Tarikan FortiGate', lp ? ago(lp.ts) : '—',
     `${s.pulls_24h} tarikan dalam 24 jam`, 1],
  ].map(([k,v,sub,small])=>`<div class="card"><div class="k">${k}</div>
      <div class="v${small?' small':''}">${esc(v)}</div><div class="s">${sub}</div></div>`).join('');

  renderDecay(s.age_buckets||[], s.ttl_days);
  fillFilter('#fSource', s.sources.map(x=>x.k));
}

function renderDecay(buckets, ttl){
  const span = Math.max(ttl, 1);
  const days = Array.from({length:span+1}, ()=>({total:0, sev:{}}));
  let over = 0, max = 1;
  for(const b of buckets){
    if(b.age > span){ over += b.count; continue; }
    const d = days[b.age];
    d.total += b.count; d.sev[b.severity] = (d.sev[b.severity]||0) + b.count;
    if(d.total > max) max = d.total;
  }
  $('#track').innerHTML = days.map((d,i)=>{
    const h = d.total ? Math.max(3, Math.round(d.total/max*54)) : 0;
    const segs = Object.entries(d.sev).sort((a,b)=>b[1]-a[1]).map(([sev,c])=>
      `<i style="height:${Math.max(1,Math.round(c/d.total*h))}px;background:${heatOf(sev)}"></i>`).join('');
    return `<span class="tick" style="height:${h}px" title="Umur ${i} hari · ${d.total} indikator">${segs}</span>`;
  }).join('') + `<span class="cliff" data-label="tebing kedaluwarsa" style="right:0"></span>`;

  $('#decayNote').textContent =
    `${buckets.reduce((a,b)=>a+b.count,0).toLocaleString('id-ID')} indikator aktif` +
    (over ? ` · ${over} sudah melewati TTL dan tidak lagi disajikan` : '');
  $('#axisMid').textContent = `${Math.floor(span/2)} hari`;
  $('#axisEnd').textContent = `${span} hari · dikeluarkan dari feed`;
}

/* --------------------------------------------------------------- indicators */
function params(){
  const p = new URLSearchParams({page:state.page, size:state.size,
    sort:state.sort, order:state.order});
  const map = {q:'#q', severity:'#fSeverity', tlp:'#fTlp', type:'#fType',
               source:'#fSource', status:'#fStatus'};
  for(const [k,sel] of Object.entries(map)) if($(sel).value) p.set(k, $(sel).value);
  return p;
}

async function loadRows(){
  const d = await api('/api/v1/indicators?'+params());
  state.pages = d.pages;
  $('#rows').innerHTML = d.items.map(r=>`
    <tr>
      <td><span class="ip${r.status!=='active'?' inactive':''}">${esc(r.ip_address)}</span>
          <div class="meta st ${esc(r.status)}">${esc(r.status)}${r.hit_count>1?` · ${r.hit_count}×`:''}</div></td>
      <td class="type">${esc(r.type)}</td>
      <td><div class="heat">
            <span class="lbl" style="color:${heatOf(r.severity)}">${esc(r.severity)}</span>
            <span class="bar"><i style="width:${r.confidence}%;background:${heatOf(r.severity)}"></i></span>
            <span class="meta">${r.confidence}%</span></div></td>
      <td><span class="badge ${tlpClass(r.tlp)}">${esc(r.tlp)}</span></td>
      <td><div class="meta">${ago(r.updated_at)}</div>
          <div class="meta" style="color:var(--dim)">${esc(r.updated_at)}</div></td>
      <td class="type">${esc(r.source)}${r.feed_name?`<div class="meta">${esc(r.feed_name)}</div>`:''}</td>
      <td class="comment">${esc(r.comment)||'<span style="color:var(--dim)">—</span>'}</td>
      <td><button class="rowdel" data-id="${r.id}" title="Hapus indikator">✕</button></td>
    </tr>`).join('');

  const e = $('#empty');
  e.hidden = d.total > 0;
  if(!d.total) e.innerHTML = '<b>Tidak ada indikator yang cocok</b>Longgarkan filter, atau tunggu push berikutnya dari FortiSOAR.';
  $('#pageInfo').textContent =
    `${d.total.toLocaleString('id-ID')} indikator · halaman ${d.page} dari ${d.pages}`;
  $('#prev').disabled = d.page<=1;
  $('#next').disabled = d.page>=d.pages;
}

function fillFilter(sel, values){
  const el=$(sel), cur=el.value, first=el.options[0].outerHTML;
  el.innerHTML = first + values.map(v=>`<option${v===cur?' selected':''}>${esc(v)}</option>`).join('');
}

async function loadFilters(){
  const f = await api('/api/v1/filters');
  fillFilter('#fSeverity', f.severities);
  fillFilter('#fTlp', f.tlps);
  fillFilter('#fType', f.types);
}

async function loadAudit(){
  const d = await api('/api/v1/audit?limit=60');
  $('#auditRows').innerHTML = d.items.map(a=>`<tr>
      <td style="color:var(--dim)">${esc(a.ts)}</td>
      <td style="color:var(--accent)">${esc(a.action)}</td>
      <td>${esc(a.actor)}</td><td>${esc(a.client_ip)}</td>
      <td>ok=${a.entries_ok} gagal=${a.entries_fail}</td>
      <td style="color:${a.status_code<300?'var(--tlp-green)':'var(--tlp-red)'}">${a.status_code}</td>
      <td>${a.duration_ms}ms</td>
      <td class="comment">${esc(a.detail)}</td></tr>`).join('');
}

/* ------------------------------------------------------------------- events */
let timer;
$('#q').addEventListener('input', ()=>{ clearTimeout(timer);
  timer=setTimeout(()=>{ state.page=1; loadRows(); }, 220); });
['#fSeverity','#fTlp','#fType','#fSource','#fStatus'].forEach(s=>
  $(s).addEventListener('change', ()=>{ state.page=1; loadRows(); }));
$('#fSize').addEventListener('change', e=>{ state.size=+e.target.value; state.page=1; loadRows(); });
$('#btnClear').onclick = ()=>{ ['#q','#fSeverity','#fTlp','#fType','#fSource','#fStatus']
  .forEach(s=>$(s).value=''); state.page=1; loadRows(); };
$('#prev').onclick = ()=>{ if(state.page>1){ state.page--; loadRows(); } };
$('#next').onclick = ()=>{ if(state.page<state.pages){ state.page++; loadRows(); } };
document.querySelectorAll('thead th[data-sort]').forEach(th=>th.onclick=()=>{
  const k=th.dataset.sort;
  state.order = state.sort===k && state.order==='desc' ? 'asc':'desc';
  state.sort=k;
  document.querySelectorAll('thead th').forEach(x=>x.querySelector('.arrow')?.remove());
  th.insertAdjacentHTML('beforeend',`<span class="arrow"> ${state.order==='desc'?'▼':'▲'}</span>`);
  loadRows();
});
$('#rows').addEventListener('click', async e=>{
  const b=e.target.closest('.rowdel'); if(!b) return;
  if(!confirm('Hapus indikator ini secara permanen?')) return;
  await api('/api/v1/indicators/'+b.dataset.id,{method:'DELETE'});
  toast('Indikator dihapus.'); boot();
});
$('#btnRefresh').onclick = ()=>{ boot(); toast('Konsol dimuat ulang.'); };
$('#btnPrune').onclick = async ()=>{
  const r = await api('/api/v1/maintenance/prune',{method:'POST'});
  toast(`Pruning selesai — ${r.expired} kedaluwarsa, ${r.deleted} dihapus.`); boot();
};

/* --------------------------------------------------------------------- boot */
async function boot(){
  try{
    const s = await api('/api/v1/stats');
    renderStats(s);
    if(!state.filtersLoaded){ await loadFilters(); state.filtersLoaded=true; }
    await loadRows();
    await loadAudit();
  }catch(err){ if(err.message!=='unauth') toast('Gagal memuat: '+err.message); }
}
boot();
setInterval(()=>{ if(!$('#gate').classList.contains('on')) boot(); }, 30000);
</script>
</body>
</html>
